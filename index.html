<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Speedometer - Clean</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="speedometer">
        <!-- Bagian Kiri -->
        <div class="sec-left">
            <div class="item">
                <div class="label">Engine</div>
                <div class="value" id="engine">Off</div>
            </div>
            <div class="item">
                <div class="label">Speed</div>
                <div class="value" id="speed">0 MPH</div>
            </div>
            <div class="item">
                <div class="label">RPM</div>
                <div class="value" id="rpm">0.0000 RPM</div>
            </div>
            <div class="item">
                <div class="label">Fuel</div>
                <div class="value" id="fuel">0.0%</div>
            </div>
            <div class="item">
                <div class="label">Health</div>
                <div class="value" id="health">100.0%</div>
            </div>
        </div>
        
        <!-- Bagian Kanan -->
        <div class="sec-right">
            <div class="item">
                <div class="label">Gear</div>
                <div class="value" id="gear">0</div>
            </div>
            <div class="item">
                <div class="label">Headlights</div>
                <div class="value" id="headlights">Off</div>
            </div>
            <div class="item">
                <div class="label">Indicators</div>
                <div class="value" id="indicators">Off / Off</div>
            </div>
            <div class="item">
                <div class="label">Seatbelts</div>
                <div class="value" id="seatbelts">Off</div>
            </div>
            <div class="item">
                <div class="label">Odometer</div>
                <div class="value" id="odometer">0.0 Miles</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
