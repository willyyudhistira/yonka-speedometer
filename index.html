<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Speedometer - Clean iOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="speedometer">
        <!-- Bagian Kiri (Sesuai template asli) -->
        <section class="sec-left">
            <dl>
                <dt>Engine</dt>
                <dd id="engine">Off</dd>
                <dt>Speed</dt>
                <dd id="speed">0 MPH</dd>
                <dt>RPM</dt>
                <dd id="rpm">0.0000 RPM</dd>
                <dt>Fuel</dt>
                <dd id="fuel">0.0%</dd>
                <dt>Health</dt>
                <dd id="health">100.0%</dd>
            </dl>
        </section>
        
        <!-- Bagian Kanan (Sesuai template asli) -->
        <section class="sec-right">
            <dl>
                <dt>Gear</dt>
                <dd id="gear">0</dd>
                <dt>Headlights</dt>
                <dd id="headlights">Off</dd>
                <dt>Indicators</dt>
                <dd id="indicators">Off / Off</dd>
                <dt>Seatbelts</dt>
                <dd id="seatbelts">Off</dd>
                <dt>Odometer</dt>
                <dd id="odometer">0.0 Miles</dd>
            </dl>
        </section>
    </main>
    <script src="script.js"></script>
    
    <!-- Skrip untuk preview di browser agar terlihat jelas -->
    <script>
        if (!window.invokeNative) {
            document.body.style.backgroundColor = "#1c1c1e";
        }
    </script>
</body>
</html>
