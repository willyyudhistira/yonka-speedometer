<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Speedometer - New UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="speedometer-hud">
        <div class="speed-section">
            <span id="speed">0 MPH</span>
            <span class="gear-badge">G: <span id="gear">0</span></span>
        </div>
        
        <div class="info-section">
            <div class="info-row"><span>Eng:</span> <span id="engine">Off</span></div>
            <div class="info-row"><span>RPM:</span> <span id="rpm">0.0000</span></div>
            <div class="info-row"><span>Fuel:</span> <span id="fuel">0.0%</span></div>
            <div class="info-row"><span>Hlt:</span> <span id="health">100.0%</span></div>
            <div class="info-row"><span>Lgt:</span> <span id="headlights">Off</span></div>
            <div class="info-row"><span>Ind:</span> <span id="indicators">Off / Off</span></div>
            <div class="info-row"><span>Belt:</span> <span id="seatbelts">Off</span></div>
            <div class="info-row"><span>Odo:</span> <span id="odometer">0.0 Miles</span></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
