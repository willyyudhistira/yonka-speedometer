<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Speedometer - Draggable iOS HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <!-- WRAPPER UTAMA (Ini yang bisa digeser/drag) -->
    <div class="speedo-wrapper" id="speedo-wrapper">
        
        <!-- PANEL SETTING HUD (Muncul di atas speedo saat tombol diklik) -->
        <div class="settings-panel" id="settings-panel">
            <div class="panel-header">
                <span>HUD Settings</span>
                <span class="material-symbols-rounded" id="close-settings">close</span>
            </div>
            <div class="panel-content">
                <div class="scale-info">
                    <span>Scale</span>
                    <span id="scale-text">100%</span>
                </div>
                <input type="range" id="scale-range" min="60" max="150" value="100" step="5">
                
                <button class="reset-btn" id="reset-pos">Reset Position</button>
            </div>
        </div>

        <!-- TOMBOL TRIGGER SETTING (Muncul saat mouse masuk ke area speedo) -->
        <div class="settings-trigger" id="settings-trigger" title="Settings">
            <span class="material-symbols-rounded">tune</span>
        </div>

        <!-- KONTEN SPEEDOMETER (Ini yang ukurannya akan berubah) -->
        <div class="ios-speedometer" id="speedo-content">
            <!-- Header Utama: Speed & Gear -->
            <div class="ios-header">
                <div class="speed-box">
                    <span id="speed">0 MPH</span>
                </div>
                <div class="gear-box">
                    <span class="sub-label">GEAR</span>
                    <span id="gear">0</span>
                </div>
            </div>

            <!-- Bagian Indikator & Progress -->
            <div class="ios-metrics">
                <div class="row-duo">
                    <div class="mini-badge" id="engine-badge">
                        <span class="material-symbols-rounded">power</span>
                        <span id="engine">Off</span>
                    </div>
                    <div class="mini-badge" id="lights-badge">
                        <span class="material-symbols-rounded">light</span>
                        <span id="headlights">Off</span>
                    </div>
                    <div class="mini-badge" id="belt-badge">
                        <span class="material-symbols-rounded">security</span>
                        <span id="seatbelts">Off</span>
                    </div>
                </div>

                <div class="progress-card">
                    <div class="card-info">
                        <span>RPM</span>
                        <span id="rpm">0.0000 RPM</span>
                    </div>
                    <div class="ios-track"><div id="rpm-bar" class="ios-fill rpm-color"></div></div>
                </div>

                <div class="progress-card">
                    <div class="card-info">
                        <span>Fuel</span>
                        <span id="fuel">0.0%</span>
                    </div>
                    <div class="ios-track"><div id="fuel-bar" class="ios-fill fuel-color"></div></div>
                </div>

                <div class="progress-card">
                    <div class="card-info">
                        <span>Health</span>
                        <span id="health">100.0%</span>
                    </div>
                    <div class="ios-track"><div id="health-bar" class="ios-fill health-color"></div></div>
                </div>

                <div class="ios-footer-row">
                    <div class="footer-item">
                        <span class="material-symbols-rounded">swap_horiz</span>
                        <span id="indicators">Off / Off</span>
                    </div>
                    <div class="footer-item">
                        <span class="material-symbols-rounded">route</span>
                        <span id="odometer">0.0 Miles</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
