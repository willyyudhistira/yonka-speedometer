<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Speedometer - Pure iOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <!-- Seksi Atas: Kecepatan & Gigi -->
        <div class="ios-top">
            <div class="speed-box">
                <span class="ios-label">SPEED</span>
                <span id="speed" class="ios-value-large">0 MPH</span>
            </div>
            <div class="gear-box">
                <span class="ios-label">GEAR</span>
                <span id="gear" class="ios-value-large">0</span>
            </div>
        </div>

        <!-- Seksi Tengah: Metrik Kendaraan -->
        <div class="ios-middle">
            <div class="ios-metric">
                <div class="icon-wrapper"><span class="material-symbols-rounded">speed</span></div>
                <span id="rpm" class="ios-value">0.0000</span>
            </div>
            <div class="ios-metric">
                <div class="icon-wrapper"><span class="material-symbols-rounded">local_gas_station</span></div>
                <span id="fuel" class="ios-value">0.0%</span>
            </div>
            <div class="ios-metric">
                <div class="icon-wrapper"><span class="material-symbols-rounded">build</span></div>
                <span id="health" class="ios-value">100.0%</span>
            </div>
            <div class="ios-metric">
                <div class="icon-wrapper"><span class="material-symbols-rounded">route</span></div>
                <span id="odometer" class="ios-value">0.0 Mi</span>
            </div>
        </div>

        <!-- Seksi Bawah: Indikator Kapsul -->
        <div class="ios-bottom">
            <div class="ios-status">
                <span class="material-symbols-rounded status-icon">power_settings_new</span>
                <span id="engine" class="status-val">Off</span>
            </div>
            <div class="ios-status">
                <span class="material-symbols-rounded status-icon">lightbulb</span>
                <span id="headlights" class="status-val">Off</span>
            </div>
            <div class="ios-status">
                <span class="material-symbols-rounded status-icon">swap_horiz</span>
                <span id="indicators" class="status-val">Off/Off</span>
            </div>
            <div class="ios-status">
                <span class="material-symbols-rounded status-icon">airline_seat_recline_normal</span>
                <span id="seatbelts" class="status-val">Off</span>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
    <script>
        // Jika tidak mendeteksi environment bawaan FiveM (invokeNative), 
        // maka ubah latar belakang menjadi gelap agar preview terlihat.
        if (!window.invokeNative) {
            document.body.style.backgroundColor = "#1c1c1e";
            document.body.style.backgroundImage = "radial-gradient(circle, #3a3a3c 0%, #1c1c1e 100%)";
        }
    </script>
</body>
</html>
