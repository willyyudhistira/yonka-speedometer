<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Speedometer - Modern HUD</title>
    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="speedometer-hud">
        <!-- Bagian Utama: Kecepatan & Gigi -->
        <div class="hud-main-display">
            <div class="speed-container">
                <span id="speed">0 MPH</span>
            </div>
            <div class="gear-container">
                <span class="gear-label">GEAR</span>
                <span id="gear">0</span>
            </div>
        </div>

        <!-- Bagian Grid Data Kendaraan -->
        <div class="hud-metrics-grid">
            <!-- Engine -->
            <div class="metric-item">
                <span class="material-symbols-rounded">power</span>
                <div class="metric-info">
                    <span class="metric-name">Engine</span>
                    <span id="engine" class="metric-val">Off</span>
                </div>
            </div>

            <!-- RPM -->
            <div class="metric-item">
                <span class="material-symbols-rounded">speed</span>
                <div class="metric-info">
                    <span class="metric-name">RPM</span>
                    <span id="rpm" class="metric-val">0.0000</span>
                </div>
            </div>

            <!-- Fuel (Dengan Progress Bar) -->
            <div class="metric-item full-width">
                <span class="material-symbols-rounded">local_gas_station</span>
                <div class="metric-info">
                    <div class="metric-header-row">
                        <span class="metric-name">Fuel</span>
                        <span id="fuel" class="metric-val">0.0%</span>
                    </div>
                    <div class="progress-track">
                        <div id="fuel-bar" class="progress-fill fuel-color"></div>
                    </div>
                </div>
            </div>

            <!-- Health (Dengan Progress Bar) -->
            <div class="metric-item full-width">
                <span class="material-symbols-rounded">car_repair</span>
                <div class="metric-info">
                    <div class="metric-header-row">
                        <span class="metric-name">Health</span>
                        <span id="health" class="metric-val">100.0%</span>
                    </div>
                    <div class="progress-track">
                        <div id="health-bar" class="progress-fill health-color"></div>
                    </div>
                </div>
            </div>

            <!-- Headlights -->
            <div class="metric-item">
                <span class="material-symbols-rounded">light</span>
                <div class="metric-info">
                    <span class="metric-name">Lights</span>
                    <span id="headlights" class="metric-val">Off</span>
                </div>
            </div>

            <!-- Indicators -->
            <div class="metric-item">
                <span class="material-symbols-rounded">swap_horiz</span>
                <div class="metric-info">
                    <span class="metric-name">Indicator</span>
                    <span id="indicators" class="metric-val">Off / Off</span>
                </div>
            </div>

            <!-- Seatbelts -->
            <div class="metric-item">
                <span class="material-symbols-rounded">security</span>
                <div class="metric-info">
                    <span class="metric-name">Seatbelt</span>
                    <span id="seatbelts" class="metric-val">Off</span>
                </div>
            </div>

            <!-- Odometer -->
            <div class="metric-item">
                <span class="material-symbols-rounded">route</span>
                <div class="metric-info">
                    <span class="metric-name">Odometer</span>
                    <span id="odometer" class="metric-val">0.0 Miles</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
